name: Cloudflare staging credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare-access:
    runs-on: ubuntu-latest
    steps:
      - name: Validate credentials without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository variable is missing or invalid"
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if ! printf '%s' "$response" | node -e '
            let raw="";process.stdin.on("data",x=>raw+=x);process.stdin.on("end",()=>{
              try { const r=JSON.parse(raw);process.exit(r.success && r.result?.status==="active" ? 0 : 1) }
              catch {process.exit(1)}
            })'; then
            echo "::error::Cloudflare API token verification failed"
            exit 1
          fi
          echo "Cloudflare token is active. No deployment was performed."
